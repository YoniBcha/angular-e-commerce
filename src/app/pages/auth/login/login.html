<app-auth-layout>
  <div class="login-container">
    <div class="form-container">
      <div class="title">Sign In</div>

      <p>
        Don’t have an account yet?
        <span routerLink="/signup">Sign Up</span>
      </p>

      <div class="form-layout">
        <app-input type="email" placeholder="Username" [(value)]="username"></app-input>
        <app-input type="password" placeholder="Password" [(value)]="password"></app-input>
      </div>
      <app-button class="button" label="Login" (click)="login()"></app-button>
    </div>
  </div>
</app-auth-layout>
