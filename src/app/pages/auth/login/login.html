<app-auth-layout>
  <div>
    <div class="title">Sign In</div>

    <p>
      Don’t have an account yet?
      <a routerLink="/signup">Sign Up</a>
    </p>

    <app-input type="text" placeholder="Username" [(value)]="username"></app-input>

    <app-input type="password" placeholder="Password" [(value)]="password"></app-input>

    <app-button label="Login" (click)="login()"></app-button>
  </div>
</app-auth-layout>
