<div class="login-container">
  <div class="login-leftside">
    <img src="Paste_image-removebg-preview.png" alt="Logo" />
  </div>
  <div class="login-rightside">
    <h2>Sign In</h2>
    <p>Don’t have an accout yet? <span href="/login">Sign Up</span></p>
    <input [(ngModel)]="username" placeholder="username" />
    <input [(ngModel)]="password" type="password" placeholder="password" />

    <app-button label="Login" (click)="login()"></app-button>
    <!-- <button (click)="login()">Login</button> -->
  </div>
</div>
